name: vpn-site

services:
  db:
    image: postgres:16-alpine
    container_name: vpn-site-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vpn_site}
      POSTGRES_USER: ${POSTGRES_USER:-vpn_site}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    cpus: 0.5

  api:
    build:
      context: ./api
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    container_name: vpn-site-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vpn_site}:${POSTGRES_PASSWORD}@vpn-site-db:5432/${POSTGRES_DB:-vpn_site}
      BOT_API_URL: ${BOT_API_URL:-}
      BOT_API_TOKEN: ${BOT_API_TOKEN:-}
      REMNAWAVE_API_URL: ${REMNAWAVE_API_URL:-}
      REMNAWAVE_API_TOKEN: ${REMNAWAVE_API_TOKEN:-}
      SUBSCRIPTION_BASE_URL: ${SUBSCRIPTION_BASE_URL:-https://sub.crs-projects.com}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://vpn.crs-projects.com}
      SESSION_COOKIE: ${SESSION_COOKIE:-__Host-sid}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_LOGIN_BOT_TOKEN: ${TELEGRAM_LOGIN_BOT_TOKEN:-}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-vpn.crs-projects.com}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-CRS VPN}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SITE_INTERNAL_TOKEN: ${SITE_INTERNAL_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8040}:8000"
    networks:
      # the bot network also has a service called "db": always use unique container names
      default: {}
      # @crs_vpn_bot calls /api/internal/tg-login/* as http://vpn-site-api:8000
      botnet:
        aliases: [vpn-site-api]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    cpus: 0.5


  web:
    build:
      context: ./web
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    container_name: vpn-site-web
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3040}:3000"
    mem_limit: 384m
    cpus: 1.0

networks:
  botnet:
    name: vpn-bot_default
    external: true

volumes:
  pgdata:
    name: vpn-site-pgdata
