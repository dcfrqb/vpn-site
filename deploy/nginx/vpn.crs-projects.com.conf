# vpn-site staging. Web on 127.0.0.1:3040, api on 127.0.0.1:8040, deploy hook on 127.0.0.1:8041.
# Needs /etc/nginx/conf.d/vpn-site-ratelimit.conf (see ratelimit.conf next to this file).
# certbot adds the ssl lines and the http->https redirect server block.
server {
    server_name vpn.crs-projects.com;

    auth_basic "vpn-site staging";
    auth_basic_user_file /etc/nginx/.htpasswd-vpn-site;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;

    location = /robots.txt { auth_basic off; default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }

    # GitHub Actions: signed request, no basic auth
    location = /_deploy {
        auth_basic off;
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8041;
        proxy_read_timeout 1600s;
    }

    location = /healthz {
        auth_basic off;
        proxy_pass http://127.0.0.1:8040/api/health;
    }

    location /api/auth/ {
        limit_req zone=vpnsite_auth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8040;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8040;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3040;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
