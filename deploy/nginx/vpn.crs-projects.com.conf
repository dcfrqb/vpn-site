# vpn-site staging. Isolated: own root, own basic auth, later proxies to 127.0.0.1:3040 (web) / 8040 (api).
server {
    server_name vpn.crs-projects.com;

    root /var/www/vpn.crs-projects.com;
    index index.html;

    auth_basic "vpn-site staging";
    auth_basic_user_file /etc/nginx/.htpasswd-vpn-site;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /robots.txt { auth_basic off; return 200 "User-agent: *\nDisallow: /\n"; }
    location / { try_files $uri $uri/ /index.html; }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/vpn.crs-projects.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vpn.crs-projects.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = vpn.crs-projects.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name vpn.crs-projects.com;
    return 404; # managed by Certbot


}